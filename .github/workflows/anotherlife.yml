name: Rewrite Author History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-all-authors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite every commit author and committer
        run: |
          git config user.name "HemanthP06"
          git config user.email "peddadahemanth6@gmail.com"

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
            export GIT_AUTHOR_NAME="HemanthP06"
            export GIT_AUTHOR_EMAIL="peddadahemanth6@gmail.com"
            export GIT_COMMITTER_NAME="HemanthP06"
            export GIT_COMMITTER_EMAIL="peddadahemanth6@gmail.com"
          ' -- --all

      - name: Force push rewritten history
        run: |
          git push origin main --force
