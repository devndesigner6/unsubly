name: Autonomous Agent — Daily Vault Release (Fallback)

# This cron is a FALLBACK for when the OpenClaw persistent agent is not running.
# The OpenClaw agent (agents/openclaw/agent-loop.mjs) runs every 5 minutes on Fly.io
# and is the primary release mechanism. This cron runs once daily as a safety net.

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      network:
        description: "Algorand network (testnet | mainnet)"
        required: false
        default: "testnet"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install algosdk --no-save

      - name: Run autonomous release agent via API
        env:
          AGENT_RUN_SECRET: ${{ secrets.AGENT_RUN_SECRET }}
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          ALGO_NETWORK: ${{ github.event.inputs.network || secrets.ALGO_NETWORK || 'testnet' }}
        run: |
          echo "Calling /api/agent-run with admin secret..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-Agent-Secret: $AGENT_RUN_SECRET" \
            "${VERCEL_URL:-https://unsubly2.vercel.app}/api/agent-run")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error title=Agent Run Failed::HTTP $HTTP_CODE — $BODY"
            exit 1
          fi

      - name: Fallback — run local agent script if API unreachable
        if: failure()
        env:
          AGENT_WALLET_MNEMONIC: ${{ secrets.AGENT_WALLET_MNEMONIC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALGO_NETWORK: ${{ github.event.inputs.network || secrets.ALGO_NETWORK || 'testnet' }}
        run: |
          echo "API unreachable — running local agent script as fallback..."
          node agents/release-agent.mjs
