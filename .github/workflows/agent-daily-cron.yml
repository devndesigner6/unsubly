name: Autonomous Agent — Daily Vault Release

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      network:
        description: "Algorand network (testnet | mainnet)"
        required: false
        default: "testnet"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install algosdk
        run: npm install algosdk --no-save

      - name: Run autonomous release agent
        env:
          AGENT_WALLET_MNEMONIC: ${{ secrets.AGENT_WALLET_MNEMONIC }}
          VAULT_APP_IDS: ${{ secrets.VAULT_APP_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Override via workflow_dispatch input; default to testnet for scheduled runs
          ALGO_NETWORK: ${{ github.event.inputs.network || secrets.ALGO_NETWORK || 'testnet' }}
        run: node agents/release-agent.mjs
