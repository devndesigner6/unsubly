name: Autonomous Agent — Vault Release (Legacy Fallback)

# This workflow is a legacy fallback. The primary agent is now the persistent
# OpenClaw agent-loop (agents/agent-loop.mjs) which runs every 5 minutes.
# This cron job exists only as a safety net — it runs a single-tick sweep
# at midnight UTC in case the persistent agent is down.

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      network:
        description: "Algorand network (testnet | mainnet)"
        required: false
        default: "testnet"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install algosdk @supabase/supabase-js --no-save

      - name: Run single-tick vault release
        env:
          AGENT_WALLET_MNEMONIC: ${{ secrets.AGENT_WALLET_MNEMONIC }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALGO_NETWORK: ${{ github.event.inputs.network || secrets.ALGO_NETWORK || 'testnet' }}
          AGENT_TICK_INTERVAL_MS: "0"
        # Run agent-loop with a 0 interval — it will execute one tick then exit
        # because the loop breaks when AGENT_TICK_INTERVAL_MS is 0.
        run: |
          timeout 120 node agents/release-agent.mjs || true
