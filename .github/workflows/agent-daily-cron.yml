  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-release-vaults edge function
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://ipnywrvwszqlaykbkske.supabase.co/functions/v1/auto-release-vaults" \
            -H "Content-Type: application/json" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlwbnl3cnZ3c3pxbGF5a2Jrc2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4OTg0NDksImV4cCI6MjA4ODQ3NDQ0OX0.xUcUpKQ52PVFGAjKokKDwhf9p8RZYmEOgMmu7HAm-sk" \
            -H "Authorization: Bearer NLJE4ZCTVQTOG4JPZ3EABZ63BON5M2XGKD5NDN77M33DCWUF5AC2DLWA5U" \
            -H "x-agent-mnemonic: ${{ secrets.AGENT_WALLET_MNEMONIC }}")
