name: Health Check — App & Agent Monitoring

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check live app
        id: app_check
        run: |
          URL="https://unsubly2.vercel.app"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "::error title=App Down::$URL returned HTTP $STATUS"
            exit 1
          fi
          echo "App is healthy: HTTP $STATUS"

      - name: Check Algorand Testnet node
        id: testnet_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://testnet-api.algonode.cloud/v2/status")
          if [ "$STATUS" != "200" ]; then
            echo "::warning title=Testnet Node::algonode testnet returned HTTP $STATUS"
          else
            echo "Testnet node healthy: HTTP $STATUS"
          fi

      - name: Check Algorand Mainnet node
        id: mainnet_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://mainnet-api.algonode.cloud/v2/status")
          if [ "$STATUS" != "200" ]; then
            echo "::warning title=Mainnet Node::algonode mainnet returned HTTP $STATUS"
          else
            echo "Mainnet node healthy: HTTP $STATUS"
          fi

      - name: Check Supabase API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://ipnywrvwszqlaykbkske.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlwbnl3cnZ3c3pxbGF5a2Jrc2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4OTg0NDksImV4cCI6MjA4ODQ3NDQ0OX0.xUcUpKQ52PVFGAjKokKDwhf9p8RZYmEOgMmu7HAm-sk")
          if [ "$STATUS" != "200" ]; then
            echo "::warning title=Supabase::API returned HTTP $STATUS"
          else
            echo "Supabase healthy: HTTP $STATUS"
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Alert] Health check failed — ${new Date().toISOString().split('T')[0]}`
            const body = `## Automated Health Check Failure\n\n` +
              `**Time:** ${new Date().toISOString()}\n` +
              `**Workflow:** [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `One or more health checks failed. Check the workflow run above for details.\n\n` +
              `**Checklist:**\n` +
              `- [ ] Verify Vercel deployment at https://unsubly2.vercel.app\n` +
              `- [ ] Verify Algorand node availability\n` +
              `- [ ] Verify Supabase project status\n` +
              `- [ ] Check agent wallet balance`

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['alert', 'monitoring'],
            })
